<section class="footer-newsletter">
  <div class="footer-newsletter__inner">
    <div class="footer_newsletter_text">
        <h3 class="footer-newsletter__title">{{ 'ui.segueix_nos_de_prop' | t }}</h3>
        
          
    </div>
    <div class="footer_newsletter_form_section">
        <form 
          class="footer-newsletter__form"
          [formGroup]="newsletterForm"
          (ngSubmit)="onSubmit()">
        <div class="footer-newsletter__controls">
          <input
            type="email"
            formControlName="email"
            [placeholder]="'ui.introdueix_el_teu_email' | t"
            class="footer-newsletter__input"
          />

          <button 
            type="submit"
            class="footer-newsletter__button"
            [disabled]="newsletterForm.invalid">
            {{ 'ui.subscriute' | t }}
          </button>
          </div>
           <p class="footer-newsletter__legal footer-newsletter__legal--form">
          {{ 'ui.en_proporcionar_nos_el_teu_email_acceptes_rebre_comunicacions_sobre_nous_llancam' | t }}
        </p>
        </form>
    </div>
  

  </div>
</section>
