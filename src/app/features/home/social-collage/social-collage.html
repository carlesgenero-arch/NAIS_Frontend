<section class="social-collage" [attr.aria-label]="'ui.moments_nais_drinks' | t">
  <header class="social-collage__statement" homeReveal>
    <h2>{{ 'home.brandStatement' | t }}</h2>
  </header>
  <div class="social-collage__photos" tabindex="0" role="group" [attr.aria-label]="'ui.moments_nais_drinks' | t">
    @for (image of images(); track image.src) {
      <figure class="social-collage__photo" [attr.data-image]="image.src" homeReveal>
        <div class="social-collage__frame">
          @if (image.href; as href) {
            <a [href]="href"><img responsiveImage responsiveSizes="(min-width: 1500px) 240px, (min-width: 768px) 16vw, (min-width: 560px) 224px, 40vw" [src]="image.src" [alt]="image.alt | t" loading="lazy" [width]="image.width" [height]="image.height" /></a>
          } @else {
            <img responsiveImage responsiveSizes="(min-width: 1500px) 240px, (min-width: 768px) 16vw, (min-width: 560px) 224px, 40vw" [src]="image.src" [alt]="image.alt | t" loading="lazy" [width]="image.width" [height]="image.height" />
          }
        </div>
      </figure>
    }
  </div>
</section>
