<section class="assorted-pack-promotion" [attr.aria-label]="'home.assortedPack.label' | t">
  <div class="pack-copy">
    <h2>{{ 'home.assortedPack.title' | t }}</h2>
    <p class="pack-tagline">{{ 'home.assortedPack.tagline' | t }}</p>
    <p>{{ 'home.assortedPack.description' | t }}</p>
  </div>
  <a class="pack-feature" [routerLink]="['/products', product().slug]"
    [attr.aria-label]="'home.assortedPack.cta' | t">
    <img class="pack-image" src="images/products/pack_sf.png" [alt]="'home.assortedPack.label' | t" width="500" height="500" loading="lazy" />
  </a>
  
  <a class="button--buy pack-cta" [routerLink]="['/products', product().slug]">{{ 'home.assortedPack.cta' | t }}</a>
  <div class="pack-botanicals" aria-hidden="true">
    <div class="pack-fruit">
      <img src="images/info-card/orange.png" alt="" width="1254" height="1254" loading="lazy" />
    </div>
    <div class="pack-mint">
      <img src="images/info-card/mint.png" alt="" width="1254" height="1254" loading="lazy" />
    </div>
    <div class="pack-ginger">
      <img src="images/info-card/gingebre.png" alt="" width="1254" height="1254" loading="lazy" />
    </div>
    <div class="pack-mango">
      <img src="images/info-card/mango.png" alt="" width="1254" height="1254" loading="lazy" />
    </div>
  </div>
</section>
