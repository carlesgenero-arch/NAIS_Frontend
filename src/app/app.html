<app-header />
<main>
  <app-hero />
  <section class="info-section" aria-label="Product characteristics" lang="ca">
    @for (card of infoCards; track card.imageSrc) {
      <app-info-card [content]="card" />
    }
  </section>
  <app-brand-message-card />
  @if (featuredProduct) {
    <app-product-card [product]="featuredProduct" />
  }
  <router-outlet />
</main>
