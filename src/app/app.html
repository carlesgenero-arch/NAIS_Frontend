@if (isPrelaunch()) {
  <div class="prelaunch-language"><app-language-selector /></div>
}
@if (!isPrelaunch() && !isAdmin()) {
  <app-header />
}
<main [attr.lang]="isAdmin() ? 'ca' : null">
  <router-outlet />
</main>
@if (!isPrelaunch() && !isAdmin()) {
  @if (!isCheckoutSuccess() && !isLegal() && !promotionModal.purchaseSuppressed()) {
    <app-promotion />
  }
}

@if (!isPrelaunch() && !isAdmin()) {
  <app-footer />
}
