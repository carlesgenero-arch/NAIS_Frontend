<dialog #dialog [class.drawer]="variant() === 'drawer'" [class.promotion]="variant() === 'promotion'" [attr.aria-label]="title() | t" aria-modal="true"
  (close)="handleNativeClose()" (cancel)="cancel($event)" (click)="closeOnBackdrop($event)">
  <h2>{{ title() | t }} @if (titleCount() !== undefined) { <span class="title-count" aria-live="polite" [attr.aria-label]="'cart.units' | t: { count: titleCount() ?? 0 }">{{ titleCount() }}</span> }</h2>
  @if (variant() === 'drawer') {
    <button class="button--nutrition modal-close" type="button" autofocus [attr.aria-label]="'ui.tancar_cistella' | t" (click)="close()">X</button>
  }
  @if (variant() === 'promotion') {
    <button class="button--nutrition modal-close" type="button" autofocus [attr.aria-label]="'ui.tancar_promocio' | t" (click)="close()">X</button>
  }
  <div class="modal-content"><ng-content /></div>
  @if (variant() === 'dialog') {
    <button class="button--nutrition modal-close" type="button" autofocus (click)="close()">{{ 'ui.tancar' | t }}</button>
  }
</dialog>
