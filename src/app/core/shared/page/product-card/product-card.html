<article class="product-card" [class.catalogue]="presentation() === 'catalogue'" [attr.data-variant]="product().variant" [attr.aria-label]="(product().name) | t">
  <div class="content">
    <h2>{{ (product().name) | t }}</h2>
    <p class="product-description">{{ (product().description) | t }}</p>
    @if (presentation() === 'catalogue' && product().ingredients) {
      <p class="product-ingredients">{{ (product().ingredients) | t }}</p>
    }
    @if (presentation() === 'catalogue') {
      <button class="button--add" type="button" [attr.aria-label]="addLabel()" (click)="addRequested.emit(product())">{{ 'ui.afegir' | t }}</button>
    } @else {
      <a class="button--buy" [routerLink]="['/products', product().slug]" [info]="'focus-product-detail'">{{ 'ui.comprar' | t }}</a>
    }
  </div>
  <figure class="visual" [attr.tabindex]="product().fruitImage ? 0 : null" [attr.aria-label]="(product().name) | t">
    @if (product().imageUrl; as imageUrl) {
      <img responsiveImage responsiveSizes="(min-width: 1024px) 512px, (min-width: 768px) 50vw, 96vw" class="image can" [src]="imageUrl" [alt]="(imageAlt()) | t" loading="lazy" />
    }
    @if (product().fruitImage; as fruitImage) {
      <div class="fruit-circle">
        <img responsiveImage responsiveSizes="(min-width: 1024px) 512px, (min-width: 768px) 50vw, 96vw" class="image fruit" [src]="fruitImage.url" [alt]="(fruitImage.alt) | t" loading="lazy" />
      </div>
    }
  </figure>
</article>
