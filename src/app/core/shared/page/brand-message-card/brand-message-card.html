<section class="brand-message" [attr.aria-label]="(heading()) | t" [class.brand-message--ready]="imageReady()" [class.brand-message--failed]="imageFailed()">
  <img loading="lazy" responsiveImage responsiveSizes="(max-width: 767px) 640px, (min-width: 1800px) 1792px, 96vw" class="brand-message-image" [src]="imageSrc()" alt="" aria-hidden="true"
    (load)="loadedSource.set(imageSrc())" (error)="failedSource.set(imageSrc())" />
  <div class="brand-message-content">
    <h2>{{ (heading()) | t }}</h2>
     <!--<p>{{ message() }}</p>
   <a class="button--buy" [href]="ctaHref()">COMPRAR</a>-->
  </div>
</section>
