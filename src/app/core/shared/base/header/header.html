<header class="site-header" lang="ca">
  <div class="utilities">
    <div class="languages" role="group" aria-label="Idioma">
      <button type="button" disabled aria-label="Català, idioma actual">CAT</button>
      <span aria-hidden="true">/</span>
      <button type="button" disabled aria-label="Castellà, pròximament" title="Castellà: pròximament">CAST</button>
    </div>
    <div class="header-actions">
      <img class="brand-mark" src="images/brand/nais-mark.svg" alt="" width="394" height="394" />
    <button class="cart" type="button" aria-haspopup="dialog" [attr.aria-expanded]="cartDrawer.isOpen()" (click)="cartDrawer.open()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 4h2l2.2 11h10.6l2-8H6" />
        <circle cx="9" cy="19" r="1" />
        <circle cx="17" cy="19" r="1" />
      </svg>
      <span role="status" aria-atomic="true">
      <span class="cart__label">Cistella: </span>
      <span class="cart__count">{{ totalQuantity() }}</span>
      <span class="cart__label"> unitats</span>
      </span>
    </button>
    </div>
  </div>
  <app-navbar />
</header>
<app-modal #cartDrawer title="La meva cistella" [titleCount]="totalQuantity()" variant="drawer">
  <app-cart presentation="drawer" />
</app-modal>
