<header class="site-header">
  <div class="utilities">
    <app-language-selector />
    <div class="header-actions">
      <img class="brand-mark" src="images/brand/nais-mark.svg" alt="" width="394" height="394" />
    <button class="cart" type="button" aria-haspopup="dialog" [attr.aria-expanded]="cartDrawer.isOpen()" (click)="cartDrawer.open()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 4h2l2.2 11h10.6l2-8H6" />
        <circle cx="9" cy="19" r="1" />
        <circle cx="17" cy="19" r="1" />
      </svg>
      <span role="status" aria-atomic="true">
      <span class="cart__label">{{ 'ui.cistella' | t }} </span>
      <span class="cart__count">{{ totalQuantity() }}</span>
      <span class="cart__label"> {{ 'ui.unitats' | t }}</span>
      </span>
    </button>
    </div>
  </div>
  <app-navbar />
</header>
<app-modal #cartDrawer [title]="'ui.la_meva_cistella' | t" [titleCount]="totalQuantity()" variant="drawer">
  <app-cart presentation="drawer" (continueShoppingRequested)="cartDrawer.close()"/>
</app-modal>
