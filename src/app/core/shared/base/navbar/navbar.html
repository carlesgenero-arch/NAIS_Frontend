<nav class="navigation" [class.navigation--home]="isHome()" [attr.aria-label]="'ui.navegacio_principal' | t">
  <button class="shop" type="button" routerLink="/products" routerLinkActive #shopLink="routerLinkActive"
    [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
    [hidden]="shopLink.isActive" [attr.aria-label]="'ui.botiga' | t"><span class="shop__label">{{ 'ui.botiga_' | t }}</span></button>
  @if (isHome()) {
    <div class="brand brand--static"><ng-container [ngTemplateOutlet]="brandImage" /></div>
  } @else {
    <a class="brand" routerLink="/" [attr.aria-label]="'ui.nais_drinks_inici' | t">
      <ng-container [ngTemplateOutlet]="brandImage" />
    </a>
  }
  <ng-template #brandImage>
    <picture>
      <source media="(max-width: 47.99rem)" srcset="images/brand/nais%20logos-03.svg" width="756" height="429" />
      <img src="images/brand/nais logos-02.svg" alt="NAIS Drinks" width="1247" height="190" fetchpriority="high" />
    </picture>
  </ng-template>
</nav>
