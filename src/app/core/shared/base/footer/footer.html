<footer class="footer" lang="ca" aria-label="Peu de pàgina">
  <div class="footer__main">
    <div class="footer__social">
      <p class="footer__label">segueix-nos</p>
      @if (instagramUrl(); as url) {
        <a class="footer__social-link" [href]="url" aria-label="Instagram de NAIS Drinks">
          <ng-container [ngTemplateOutlet]="instagramIcon" />
        </a>
      } @else {
        <span class="footer__social-link" role="link" aria-disabled="true" aria-label="Instagram de NAIS Drinks, pròximament">
          <ng-container [ngTemplateOutlet]="instagramIcon" />
        </span>
      }
    </div>

    <a class="footer__brand" routerLink="/" aria-label="NAIS Drinks, inici">
      <img src="images/brand/nais-logo.svg" alt="NAIS Drinks" width="756" height="429" loading="lazy" />
    </a>

    <div class="footer__contact">
      <p class="footer__label">escriu-nos</p>
      <a class="footer__email" href="mailto:hola@naisdrinks.com">hola@naisdrinks.com</a>
    </div>
  </div>

  <div class="footer__bottom">
    <p class="footer__copyright">© {{ year }} NAIS DRINKS. Tots els drets reservats</p>
    <nav aria-label="Informació legal">
      <ul class="footer__legal">
        @for (link of legalLinks(); track link.label) {
          <li>
            @if (link.url; as url) {
              <a [href]="url">{{ link.label }}</a>
            } @else {
              <span role="link" aria-disabled="true">{{ link.label }}</span>
            }
          </li>
        }
      </ul>
    </nav>
  </div>
</footer>

<ng-template #instagramIcon>
  <svg class="footer__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
    <rect x="3" y="3" width="18" height="18" rx="4" />
    <circle cx="12" cy="12" r="4" />
    <circle class="footer__icon-dot" cx="17.5" cy="6.5" r="1" />
  </svg>
</ng-template>
